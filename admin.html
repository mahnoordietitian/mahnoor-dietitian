<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel | Mahnoor Dietitian</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #FBF8F3;

      color: #2D2D2D;

    }


    header {

      background: white;

      border-bottom: 1px solid #eee;

      padding: 18px 30px;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .brand {

      font-size: 24px;

      font-weight: 600;

      color: #6E4A7E;

    }


    .logout {

      border: none;

      background: #6E4A7E;

      color: white;

      padding: 10px 18px;

      border-radius: 8px;

      cursor: pointer;

    }


    main {

      max-width: 1200px;

      margin: 0 auto;

      padding: 40px 20px;

    }


    .welcome {

      margin-bottom: 30px;

    }


    .welcome h1 {

      margin: 0 0 8px;

      font-size: 32px;

    }


    .welcome p {

      margin: 0;

      color: #666;

    }


    .cards {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(200px, 1fr)
        );

      gap: 20px;

      margin-bottom: 35px;

    }


    .card {

      background: white;

      padding: 25px;

      border-radius: 14px;

      border: 1px solid #eee;

    }


    .card-title {

      color: #777;

      font-size: 14px;

      margin-bottom: 10px;

    }


    .card-number {

      font-size: 30px;

      font-weight: 600;

      color: #6E4A7E;

    }


    .section {

      background: white;

      padding: 25px;

      border-radius: 14px;

      border: 1px solid #eee;

      margin-bottom: 25px;

    }


    .section-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 20px;

      gap: 15px;

    }


    .section-header h2 {

      margin: 0;

    }


    .add-btn {

      background: #6E4A7E;

      color: white;

      border: none;

      border-radius: 8px;

      padding: 11px 18px;

      cursor: pointer;

    }


    .form-container {

      display: none;

      margin-top: 25px;

      padding-top: 25px;

      border-top: 1px solid #eee;

    }


    .form-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(250px, 1fr)
        );

      gap: 18px;

    }


    .field {

      display: flex;

      flex-direction: column;

    }


    .field.full {

      grid-column: 1 / -1;

    }


    label {

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;

    }


    input,
    select,
    textarea {

      width: 100%;

      padding: 12px;

      border: 1px solid #ddd;

      border-radius: 8px;

      font-family: inherit;

      font-size: 15px;

      background: white;

    }


    textarea {

      min-height: 90px;

      resize: vertical;

    }


    input:focus,
    select:focus,
    textarea:focus {

      outline: none;

      border-color: #6E4A7E;

    }


    .calculated {

      background: #FBF8F3;

      border-color: #DCCBB3;

    }


    .form-actions {

      margin-top: 25px;

      display: flex;

      gap: 12px;

      flex-wrap: wrap;

    }


    .save-btn {

      background: #6E4A7E;

      color: white;

      border: none;

      border-radius: 8px;

      padding: 13px 25px;

      cursor: pointer;

    }


    .cancel-btn {

      background: white;

      color: #2D2D2D;

      border: 1px solid #ccc;

      border-radius: 8px;

      padding: 13px 25px;

      cursor: pointer;

    }


    .message {

      margin-top: 15px;

      min-height: 20px;

      font-size: 14px;

    }


    .client-list {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .client {

      border: 1px solid #eee;

      border-radius: 10px;

      padding: 18px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

    }


    .client-info strong {

      font-size: 17px;

    }


    .client-info p {

      margin: 5px 0 0;

      color: #777;

      font-size: 14px;

    }


    .client-actions {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

    }


    .small-btn {

      border: none;

      border-radius: 7px;

      padding: 8px 12px;

      font-size: 13px;

      cursor: pointer;

    }


    .edit-btn {

      background: #eee;

    }


    .delete-btn {

      background: #f5dddd;

      color: #8b2222;

    }


    .empty {

      padding: 35px 10px;

      text-align: center;

      color: #777;

    }


    .uid-status {

      display: inline-block;

      margin-top: 8px;

      padding: 5px 9px;

      border-radius: 6px;

      font-size: 12px;

    }


    .connected {

      background: #edf7ef;

      color: #286b35;

    }


    .not-connected {

      background: #fff4df;

      color: #946200;

    }


    @media (max-width: 650px) {

      header {
        padding: 15px;
      }

      main {
        padding: 25px 15px;
      }

      .section {
        padding: 18px;
      }

      .client {

        align-items: flex-start;

        flex-direction: column;

      }

    }

  </style>

</head>


<body>


<header>

  <div class="brand">
    Mahnoor Dietitian
  </div>


  <button
    class="logout"
    id="logoutBtn"
  >
    Logout
  </button>

</header>



<main>


  <div class="welcome">

    <h1>
      Hi, Mahnoor!
    </h1>

    <p>
      Welcome to your client management panel.
    </p>

  </div>



  <!-- =================================================
       DASHBOARD
  ================================================== -->

  <div class="cards">


    <div class="card">

      <div class="card-title">
        Total Clients
      </div>

      <div
        class="card-number"
        id="clientCount"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Active Programs
      </div>

      <div
        class="card-number"
        id="activeProgramCount"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Check-ins Due
      </div>

      <div
        class="card-number"
        id="checkinCount"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Payments Received
      </div>

      <div
        class="card-number"
        id="paymentTotal"
      >
        Rs. 0
      </div>

    </div>

  </div>



  <!-- =================================================
       CLIENTS
  ================================================== -->

  <div class="section">


    <div class="section-header">

      <h2>
        Clients
      </h2>


      <button
        class="add-btn"
        id="addClientBtn"
      >
        + Add Client
      </button>

    </div>



    <!-- =================================================
         FORM
    ================================================== -->

    <div
      class="form-container"
      id="clientFormContainer"
    >


      <form id="clientForm">


        <div class="form-grid">


          <div class="field full">

            <h3>
              Client Information
            </h3>

          </div>


          <div class="field">

            <label>
              Full Name *
            </label>

            <input
              type="text"
              id="name"
              required
            >

          </div>


          <div class="field">

            <label>
              Email *
            </label>

            <input
              type="email"
              id="email"
              required
            >

          </div>


          <div class="field">

            <label>
              Phone
            </label>

            <input
              type="tel"
              id="phone"
            >

          </div>


          <div class="field">

            <label>
              Date of Birth
            </label>

            <input
              type="date"
              id="dob"
            >

          </div>


          <div class="field">

            <label>
              City
            </label>

            <input
              type="text"
              id="city"
            >

          </div>



          <div class="field full">

            <h3>
              Enrollment
            </h3>

          </div>


          <div class="field">

            <label>
              Program Type *
            </label>

            <select
              id="programType"
              required
            >

              <option value="">
                Select program type
              </option>

              <option value="1:1 Coaching">
                1:1 Coaching
              </option>

              <option value="Membership">
                Membership
              </option>

              <option value="Short Program">
                Short Program
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Program Name *
            </label>

            <input
              type="text"
              id="programName"
              required
            >

          </div>


          <div class="field">

            <label>
              Duration *
            </label>

            <select
              id="duration"
              required
            >

              <option value="">
                Select duration
              </option>

              <option value="30">
                30 Days
              </option>

              <option value="45">
                45 Days
              </option>

              <option value="60">
                60 Days
              </option>

              <option value="90">
                90 Days
              </option>

              <option value="180">
                6 Months
              </option>

              <option value="365">
                12 Months
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Start Date *
            </label>

            <input
              type="date"
              id="startDate"
              required
            >

          </div>


          <div class="field">

            <label>
              End Date
            </label>

            <input
              type="date"
              id="endDate"
              class="calculated"
              readonly
            >

          </div>



          <div class="field full">

            <h3>
              Payment
            </h3>

          </div>


          <div class="field">

            <label>
              Program Price (Rs.) *
            </label>

            <input
              type="number"
              id="programPrice"
              min="0"
              required
            >

          </div>


          <div class="field">

            <label>
              Amount Paid (Rs.) *
            </label>

            <input
              type="number"
              id="amountPaid"
              min="0"
              required
            >

          </div>


          <div class="field">

            <label>
              Remaining Amount
            </label>

            <input
              type="number"
              id="remainingAmount"
              class="calculated"
              readonly
            >

          </div>


          <div class="field">

            <label>
              Payment Status *
            </label>

            <select
              id="paymentStatus"
              required
            >

              <option value="">
                Select status
              </option>

              <option value="Paid">
                Paid
              </option>

              <option value="Partially Paid">
                Partially Paid
              </option>

              <option value="Pending">
                Pending
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              Payment Method
            </label>

            <select
              id="paymentMethod"
            >

              <option value="">
                Select method
              </option>

              <option value="Cash">
                Cash
              </option>

              <option value="Bank Transfer">
                Bank Transfer
              </option>

              <option value="JazzCash">
                JazzCash
              </option>

              <option value="EasyPaisa">
                EasyPaisa
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <div class="field full">

            <label>
              Admin Notes
            </label>

            <textarea
              id="notes"
              placeholder="Private notes..."
            ></textarea>

          </div>


        </div>



        <div class="form-actions">

          <button
            type="submit"
            class="save-btn"
            id="saveClientBtn"
          >
            Save Client
          </button>


          <button
            type="button"
            class="cancel-btn"
            id="cancelClientBtn"
          >
            Cancel
          </button>

        </div>


        <div
          class="message"
          id="formMessage"
        ></div>


      </form>

    </div>



    <!-- =================================================
         CLIENT LIST
    ================================================== -->

    <div
      class="client-list"
      id="clientsArea"
    >

      <div class="empty">
        Loading clients...
      </div>

    </div>


  </div>


</main>



<script type="module">


  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



  // =====================================================
  // FIREBASE
  // =====================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

    authDomain:
      "mahnoor-dietitian.firebaseapp.com",

    projectId:
      "mahnoor-dietitian",

    storageBucket:
      "mahnoor-dietitian.firebasestorage.app",

    messagingSenderId:
      "900688855173",

    appId:
      "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const ADMIN_EMAIL =
    "mahnoordietitian3@gmail.com";



  // =====================================================
  // ELEMENTS
  // =====================================================

  const form =
    document.getElementById(
      "clientForm"
    );


  const formContainer =
    document.getElementById(
      "clientFormContainer"
    );


  const clientsArea =
    document.getElementById(
      "clientsArea"
    );


  const formMessage =
    document.getElementById(
      "formMessage"
    );


  let editingClientId =
    null;


  let clientsCache =
    [];



  // =====================================================
  // ADMIN AUTH
  // =====================================================

  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      if (
        user.email !==
        ADMIN_EMAIL
      ) {

        alert(
          "You do not have permission to access the Admin Panel."
        );

        await signOut(auth);

        window.location.href =
          "login.html";

        return;

      }


      await loadClients();

    }
  );



  // =====================================================
  // LOAD CLIENTS
  // =====================================================

  async function loadClients() {


    clientsArea.innerHTML =
      `
        <div class="empty">
          Loading clients...
        </div>
      `;


    try {


      const snapshot =
        await getDocs(
          collection(
            db,
            "clients"
          )
        );


      clientsCache =
        snapshot.docs.map(
          item => ({

            id:
              item.id,

            ...item.data()

          })
        );


      updateDashboard(
        clientsCache
      );


      renderClients(
        clientsCache
      );

    }

    catch (error) {

      console.error(error);


      clientsArea.innerHTML =
        `
          <div class="empty">
            Unable to load clients.
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

    }

  }



  // =====================================================
  // RENDER CLIENTS
  // =====================================================

  function renderClients(
    clients
  ) {


    if (
      clients.length === 0
    ) {

      clientsArea.innerHTML =
        `
          <div class="empty">
            No clients added yet.
            <br><br>
            Click "+ Add Client" to add one.
          </div>
        `;

      return;

    }


    clientsArea.innerHTML =
      clients
        .map(
          client => {

            const connected =
              !!client.uid;


            return `

              <div class="client">

                <div class="client-info">

                  <strong>
                    ${escapeHtml(
                      client.name ||
                      "Unnamed Client"
                    )}
                  </strong>

                  <p>
                    ${escapeHtml(
                      client.email ||
                      ""
                    )}
                  </p>

                  <p>
                    ${escapeHtml(
                      client.programName ||
                      "No program"
                    )}
                    •
                    ${escapeHtml(
                      String(
                        client.duration ||
                        ""
                      )
                    )}
                    days
                  </p>

                  <p>
                    Start:
                    ${escapeHtml(
                      client.startDate ||
                      "-"
                    )}
                    |
                    End:
                    ${escapeHtml(
                      client.endDate ||
                      "-"
                    )}
                  </p>

                  <p>
                    Paid:
                    Rs.
                    ${Number(
                      client.amountPaid ||
                      0
                    ).toLocaleString()}
                    |
                    Remaining:
                    Rs.
                    ${Number(
                      client.remainingAmount ||
                      0
                    ).toLocaleString()}
                  </p>

                  <span
                    class="uid-status ${
                      connected
                        ? "connected"
                        : "not-connected"
                    }"
                  >
                    ${
                      connected
                        ? "✓ Account connected"
                        : "Account not created yet"
                    }
                  </span>

                </div>


                <div class="client-actions">

                  <button
                    class="small-btn edit-btn"
                    data-edit="${client.id}"
                  >
                    Edit
                  </button>


                  <button
                    class="small-btn delete-btn"
                    data-delete="${client.id}"
                  >
                    Delete
                  </button>

                </div>

              </div>

            `;

          }
        )
        .join("");


    document
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              editClient(
                button.dataset.edit
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        "[data-delete]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              deleteClient(
                button.dataset.delete
              );

            }
          );

        }
      );

  }



  // =====================================================
  // DASHBOARD
  // =====================================================

  function updateDashboard(
    clients
  ) {


    document.getElementById(
      "clientCount"
    ).textContent =
      clients.length;


    const today =
      new Date()
        .toISOString()
        .split("T")[0];


    const active =
      clients.filter(
        client => {

          return (
            client.startDate &&
            client.endDate &&
            client.startDate <= today &&
            client.endDate >= today
          );

        }
      );


    document.getElementById(
      "activeProgramCount"
    ).textContent =
      active.length;


    const totalPaid =
      clients.reduce(
        (sum, client) => {

          return (
            sum +
            Number(
              client.amountPaid ||
              0
            )
          );

        },
        0
      );


    document.getElementById(
      "paymentTotal"
    ).textContent =
      "Rs. " +
      totalPaid.toLocaleString();

  }



  // =====================================================
  // OPEN ADD FORM
  // =====================================================

  document
    .getElementById(
      "addClientBtn"
    )
    .addEventListener(
      "click",
      () => {

        editingClientId =
          null;

        form.reset();

        formMessage.textContent =
          "";

        document.getElementById(
          "saveClientBtn"
        ).textContent =
          "Save Client";

        formContainer.style.display =
          "block";

        document.getElementById(
          "name"
        ).focus();

      }
    );



  // =====================================================
  // CANCEL
  // =====================================================

  document
    .getElementById(
      "cancelClientBtn"
    )
    .addEventListener(
      "click",
      () => {

        form.reset();

        editingClientId =
          null;

        formMessage.textContent =
          "";

        formContainer.style.display =
          "none";

      }
    );



  // =====================================================
  // PROGRAM TYPE
  // =====================================================

  document
    .getElementById(
      "programType"
    )
    .addEventListener(
      "change",
      event => {

        const type =
          event.target.value;


        const programName =
          document.getElementById(
            "programName"
          );


        if (
          type ===
          "1:1 Coaching"
        ) {

          programName.value =
            "90-Day Freedom Mentorship™";

        }


        else if (
          type ===
          "Membership"
        ) {

          programName.value =
            "Freedom Women's Health Club";

        }


        else {

          programName.value =
            "";

        }

      }
    );



  // =====================================================
  // END DATE
  // =====================================================

  function calculateEndDate() {


    const start =
      document.getElementById(
        "startDate"
      ).value;


    const duration =
      Number(
        document.getElementById(
          "duration"
        ).value
      );


    if (
      !start ||
      !duration
    ) {

      document.getElementById(
        "endDate"
      ).value =
        "";

      return;

    }


    const date =
      new Date(
        start +
        "T00:00:00"
      );


    date.setDate(
      date.getDate() +
      duration -
      1
    );


    document.getElementById(
      "endDate"
    ).value =
      formatDate(
        date
      );

  }



  document
    .getElementById(
      "startDate"
    )
    .addEventListener(
      "change",
      calculateEndDate
    );


  document
    .getElementById(
      "duration"
    )
    .addEventListener(
      "change",
      calculateEndDate
    );



  // =====================================================
  // REMAINING PAYMENT
  // =====================================================

  function calculateRemaining() {


    const price =
      Number(
        document.getElementById(
          "programPrice"
        ).value
      ) || 0;


    const paid =
      Number(
        document.getElementById(
          "amountPaid"
        ).value
      ) || 0;


    document.getElementById(
      "remainingAmount"
    ).value =
      Math.max(
        price -
        paid,
        0
      );

  }



  document
    .getElementById(
      "programPrice"
    )
    .addEventListener(
      "input",
      calculateRemaining
    );


  document
    .getElementById(
      "amountPaid"
    )
    .addEventListener(
      "input",
      calculateRemaining
    );



  // =====================================================
  // SAVE CLIENT
  // =====================================================

  form.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      formMessage.textContent =
        "Saving...";


      const price =
        Number(
          document.getElementById(
            "programPrice"
          ).value
        ) || 0;


      const paid =
        Number(
          document.getElementById(
            "amountPaid"
          ).value
        ) || 0;


      const remaining =
        Math.max(
          price -
          paid,
          0
        );


      const clientData = {

        name:
          document.getElementById(
            "name"
          ).value.trim(),

        email:
          document.getElementById(
            "email"
          ).value
            .trim()
            .toLowerCase(),

        phone:
          document.getElementById(
            "phone"
          ).value.trim(),

        dob:
          document.getElementById(
            "dob"
          ).value,

        city:
          document.getElementById(
            "city"
          ).value.trim(),

        programType:
          document.getElementById(
            "programType"
          ).value,

        programName:
          document.getElementById(
            "programName"
          ).value.trim(),

        duration:
          Number(
            document.getElementById(
              "duration"
            ).value
          ),

        startDate:
          document.getElementById(
            "startDate"
          ).value,

        endDate:
          document.getElementById(
            "endDate"
          ).value,

        programPrice:
          price,

        amountPaid:
          paid,

        remainingAmount:
          remaining,

        paymentStatus:
          document.getElementById(
            "paymentStatus"
          ).value,

        paymentMethod:
          document.getElementById(
            "paymentMethod"
          ).value,

        notes:
          document.getElementById(
            "notes"
          ).value.trim(),

        updatedAt:
          serverTimestamp()

      };



      try {


        // =================================================
        // EDIT
        // =================================================

        if (
          editingClientId
        ) {


          await updateDoc(

            doc(
              db,
              "clients",
              editingClientId
            ),

            clientData

          );


          formMessage.textContent =
            "Client updated successfully ✓";

        }


        // =================================================
        // CREATE
        // =================================================

        else {


          clientData.createdAt =
            serverTimestamp();


          // IMPORTANT:
          //
          // addDoc() creates a RANDOM FIRESTORE ID.
          //
          // This is intentional.
          //
          await addDoc(

            collection(
              db,
              "clients"
            ),

            clientData

          );


          formMessage.textContent =
            "Client added successfully ✓";

        }


        await loadClients();


        setTimeout(
          () => {

            form.reset();

            editingClientId =
              null;

            formContainer.style.display =
              "none";

            formMessage.textContent =
              "";

          },
          700
        );

      }

      catch (error) {

        console.error(error);


        formMessage.textContent =
          "Unable to save client: " +
          error.message;

      }

    }
  );

  // =====================================================

  // =====================================================

  async function deleteClient(
    id
  ) {


    const confirmed =
      confirm(
        "Are you sure you want to delete this client?"
      );


    if (!confirmed) {

      return;

    }


    try {


      await deleteDoc(

        doc(
          db,
          "clients",
          id
        )

      );


      await loadClients();

    }

    catch (error) {

      console.error(error);


      alert(
        "Unable to delete client: " +
        error.message
      );

    }

  }

  // =====================================================
  // HELPERS
  // =====================================================

  function formatDate(
    date
  ) {

    const year =
      date.getFullYear();


    const month =
      String(
        date.getMonth() +
        1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }



  function escapeHtml(
    value
  ) {

    return String(
      value
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }
