<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | Mahnoor Dietitian</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #FBF8F3;
      color: #2D2D2D;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
      padding: 18px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 24px;
      font-weight: 600;
      color: #6E4A7E;
    }

    .logout {
      border: none;
      background: #6E4A7E;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .welcome p {
      margin: 0;
      color: #666;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 20px;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #eee;
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-number {
      font-size: 30px;
      font-weight: 600;
      color: #6E4A7E;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #eee;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0;
    }

    .add-btn {
      background: #6E4A7E;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
    }

    .empty {
      padding: 35px 10px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    Mahnoor Dietitian
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>

</header>


<main>

  <div class="welcome">

    <h1>Hi, Mahnoor!</h1>

    <p>
      Welcome from Mahnoor Dietitian.
    </p>

  </div>


  <!-- Dashboard cards -->

  <div class="cards">

    <div class="card">

      <div class="card-title">
        Total Clients
      </div>

      <div
        class="card-number"
        id="clientCount"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Active Programs
      </div>

      <div class="card-number">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Check-ins Due
      </div>

      <div class="card-number">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Payments
      </div>

      <div class="card-number">
        Rs. 0
      </div>

    </div>

  </div>


  <!-- Clients -->

  <div class="section">

    <div class="section-header">

      <h2>
        Clients
      </h2>

      <button
        class="add-btn"
        id="addClientBtn"
      >
        + Add Client
      </button>

    </div>


    <div
      class="empty"
      id="clientsArea"
    >
      Loading clients...
    </div>

  </div>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // Firebase configuration

  const firebaseConfig = {

    apiKey:
      "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

    authDomain:
      "mahnoor-dietitian.firebaseapp.com",

    projectId:
      "mahnoor-dietitian",

    storageBucket:
      "mahnoor-dietitian.firebasestorage.app",

    messagingSenderId:
      "900688855173",

    appId:
      "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

  };


  // Initialize Firebase

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  const ADMIN_EMAIL =
    "mahnoordietitian3@gmail.com";


  // Check admin login

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    if (user.email !== ADMIN_EMAIL) {

      alert(
        "You do not have permission to access the Admin Panel."
      );

      await signOut(auth);

      window.location.href =
        "login.html";

      return;

    }


    // Load clients

    await loadClients();

  });


  // Load clients from Firestore

  async function loadClients() {

    const clientsArea =
      document.getElementById("clientsArea");

    const clientCount =
      document.getElementById("clientCount");


    try {

      const snapshot =
        await getDocs(
          collection(db, "clients")
        );


      const clients =
        snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));


      clientCount.textContent =
        clients.length;


      if (clients.length === 0) {

        clientsArea.innerHTML = `
          <div class="empty">
            No clients added yet.
            <br><br>
            Click "+ Add Client" to add your first client.
          </div>
        `;

        return;

      }


      clientsArea.innerHTML =
        clients.map(client => `
          <div style="
            padding:15px;
            border-bottom:1px solid #eee;
          ">
            <strong>
              ${client.name || "Unnamed Client"}
            </strong>

            <br>

            <span style="color:#777;">
              ${client.email || ""}
            </span>
          </div>
        `).join("");


    } catch (error) {

      console.error(error);

      clientsArea.innerHTML = `
        <div class="empty">
          Unable to load clients.
          <br>
          Please check your Firebase settings.
        </div>
      `;

    }

  }


  // Add client button

  document
    .getElementById("addClientBtn")
    .addEventListener("click", () => {

      alert(
        "Client enrollment form will be added in the next step."
      );

    });


  // Logout

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await signOut(auth);

      window.location.href =
        "login.html";

    });

</script>

</body>
</html>
