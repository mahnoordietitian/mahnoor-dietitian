```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Client Login | Mahnoor Dietitian</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #FBF8F3;
      font-family: Arial, sans-serif;
      color: #2D2D2D;
    }

    .box {
      width: 100%;
      max-width: 450px;
      padding: 36px;
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #eee;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.07);
    }

    .brand {
      text-align: center;
      color: #6E4A7E;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin: 20px 0 10px;
      color: #2D2D2D;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    form {
      width: 100%;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2D2D2D;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d9d9d9;
      border-radius: 9px;
      background: #ffffff;
      color: #2D2D2D;
      font-size: 15px;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #6E4A7E;
      box-shadow:
        0 0 0 3px
        rgba(110, 74, 126, 0.10);
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 13px 16px;
      margin-top: 4px;
      border: none;
      border-radius: 9px;
      background: #6E4A7E;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition:
        opacity 0.2s,
        transform 0.1s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #777;
      line-height: 1.6;
    }

    .switch a {
      color: #6E4A7E;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }

    .switch a:hover {
      text-decoration: underline;
    }

    .message {
      width: 100%;
      margin-top: 20px;
      padding: 15px 16px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.success {
      display: block;
      background: #edf7ef;
      color: #286b35;
      border: 1px solid #cce8d1;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #9b2c2c;
      border: 1px solid #f0caca;
    }

    .message-title {
      font-weight: 700;
      display: block;

    }

    .hidden {

    @media (max-width: 500px) {

      .box {
        padding: 28px 22px;
      }

      .brand {
        font-size: 24px;
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <div class="box">


    <!-- BRAND -->

    <div class="brand">
      Mahnoor Dietitian
    </div>


    <!-- =================================================
         LOGIN
         ================================================= -->

    <div id="loginSection">

      <h1>
        Client Login
      </h1>

      <div class="subtitle">
        Sign in to access your personal
        nutrition coaching dashboard.
      </div>


      <form id="loginForm">

        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <div class="switch">

        Don't have an account?

        <a id="showSignup">
          Create account
        </a>

      </div>

    </div>



    <!-- =================================================
         SIGNUP
         ================================================= -->

    <div
      id="signupSection"
      class="hidden"
    >

      <h1>
        Create Your Account
      </h1>


      <div class="subtitle">
        Use the same email address that you
        provided to Mahnoor Dietitian.
      </div>


      <form id="signupForm">


        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          id="signupButton"
        >
          Create Account
        </button>


      </form>


      <div class="switch">

        Already have an account?

        <a id="showLogin">
          Login
        </a>

      </div>

    </div>



    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
      role="alert"
    ></div>


  </div>



  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">


    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      updateDoc,
      doc
    }
    from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

      authDomain:
        "mahnoor-dietitian.firebaseapp.com",

      projectId:
        "mahnoor-dietitian",

      storageBucket:
        "mahnoor-dietitian.firebasestorage.app",

      messagingSenderId:
        "900688855173",

      appId:
        "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginSection =
      document.getElementById(
        "loginSection"
      );


    const signupSection =
      document.getElementById(
        "signupSection"
      );


    const message =
      document.getElementById(
        "message"
      );


    const signupButton =
      document.getElementById(
        "signupButton"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );



    // =====================================================
    // SHOW SIGNUP
    // =====================================================

    document
      .getElementById("showSignup")
      .addEventListener(
        "click",
        () => {

          loginSection
            .classList
            .add("hidden");

          signupSection
            .classList
            .remove("hidden");

          clearMessage();

        }
      );



    // =====================================================
    // SHOW LOGIN
    // =====================================================

    document
      .getElementById("showLogin")
      .addEventListener(
        "click",
        () => {

          signupSection
            .classList
            .add("hidden");

          loginSection
            .classList
            .remove("hidden");

          clearMessage();

        }
      );



    // =====================================================
    // CLIENT SIGNUP
    // =====================================================

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          clearMessage();

          signupButton.disabled = true;

          signupButton.textContent =
            "Checking enrollment...";


          const email =
            document
              .getElementById("signupEmail")
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById("signupPassword")
              .value;


          const confirmPassword =
            document
              .getElementById("confirmPassword")
              .value;



          // =================================================
          // PASSWORD CHECK
          // =================================================

          if (
            password !== confirmPassword
          ) {

            showError(
              "Passwords do not match. Please enter the same password in both fields."
            );

            resetSignupButton();

            return;

          }



          try {


            // =================================================
            // CHECK CLIENT ENROLLMENT
            // =================================================

            const clientQuery =
              query(

                collection(
                  db,
                  "clients"
                ),

                where(
                  "email",
                  "==",
                  email
                )

              );


            const clientSnapshot =
              await getDocs(
                clientQuery
              );


            if (
              clientSnapshot.empty
            ) {

              showError(
                "We couldn't find an enrollment for this email. Please make sure you are using the same email address that was registered by Mahnoor Dietitian."
              );

              resetSignupButton();

              return;

            }


            const existingClient =
              clientSnapshot.docs[0];


            const existingData =
              existingClient.data();



            // =================================================
            // ALREADY CONNECTED
            // =================================================

            if (
              existingData.uid
            ) {

              showError(
                "An account has already been connected to this enrollment. Please use Login instead."
              );

              resetSignupButton();

              return;

            }



            // =================================================
            // CREATE FIREBASE ACCOUNT
            // =================================================

            signupButton.textContent =
              "Creating Account...";


            const credential =
              await createUserWithEmailAndPassword(
                auth,
                email,
                password
              );


            const user =
              credential.user;



            // =================================================
            // SEND VERIFICATION EMAIL
            // =================================================

            await sendEmailVerification(
              user
            );



            // =================================================
            // IMPORTANT
            //
            // UID is NOT connected during signup.
            //
            // It will be connected after the client
            // verifies the email and logs in.
            // =================================================

            showSuccess(
              "Your account has been created. Please check your email and click the verification link. After verifying your email, return here and log in."
            );


            document
              .getElementById("signupForm")
              .reset();


            // Sign out so the unverified account
            // does not remain active on this page.

            await signOut(auth);


          }

          catch (error) {

            console.error(
              "Signup error:",
              error
            );


            showError(
              firebaseErrorMessage(
                error
              )
            );

          }


          resetSignupButton();

        }
      );



    // =====================================================
    // CLIENT LOGIN
    // =====================================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          clearMessage();

          loginButton.disabled = true;

          loginButton.textContent =
            "Logging in...";


          const email =
            document
              .getElementById("loginEmail")
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById("loginPassword")
              .value;



          try {


            // =================================================
            // LOGIN
            // =================================================

            const credential =
              await signInWithEmailAndPassword(
                auth,
                email,
                password
              );


            const user =
              credential.user;


            await user.reload();



            // =================================================
            // EMAIL VERIFICATION
            // =================================================

            if (
              !user.emailVerified
            ) {

              showError(
                "Your email is not verified yet. Please check your inbox and click the Firebase verification link before logging in."
              );

              await signOut(auth);

              resetLoginButton();

              return;

            }



            // =================================================
            // FIND CLIENT ENROLLMENT
            // =================================================

            loginButton.textContent =
              "Checking enrollment...";


            const clientQuery =
              query(

                collection(
                  db,
                  "clients"
                ),

                where(
                  "email",
                  "==",
                  email
                )

              );


            const snapshot =
              await getDocs(
                clientQuery
              );



            if (
              snapshot.empty
            ) {

              showError(
                "Your account exists, but we could not find a client enrollment for this email. Please contact Mahnoor Dietitian."
              );

              await signOut(auth);

              resetLoginButton();

              return;

            }



            const clientDoc =
              snapshot.docs[0];


            const clientData =
              clientDoc.data();



            // =================================================
            // CHECK EXISTING UID
            // =================================================

            if (
              clientData.uid
              &&
              clientData.uid !== user.uid
            ) {

              showError(
                "This enrollment is already connected to another account. Please contact Mahnoor Dietitian."
              );

              await signOut(auth);

              resetLoginButton();

              return;

            }



            // =================================================
            // CONNECT UID
            // =================================================

            if (
              !clientData.uid
            ) {

              loginButton.textContent =
                "Connecting account...";


              await updateDoc(

                doc(
                  db,
                  "clients",
                  clientDoc.id
                ),

                {
                  uid: user.uid
                }

              );

            }



            // =================================================
            // SUCCESS
            // =================================================

            showSuccess(
              "Login successful. Opening your dashboard..."
            );


            setTimeout(
              () => {

                window.location.href =
                  "client-dashboard.html";

              },
              1000
            );

          }

          catch (error) {

            console.error(
              "Login error:",
              error
            );


            showError(
              firebaseErrorMessage(
                error
              )
            );


            resetLoginButton();

          }

        }
      );



    // =====================================================
    // SUCCESS MESSAGE
    // =====================================================

    function showSuccess(text) {

      message.innerHTML =
        `<span class="message-title">✓ Success</span>${escapeHtml(text)}`;

      message.className =
        "message success";

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }



    // =====================================================
    // ERROR MESSAGE
    // =====================================================

    function showError(text) {

      message.innerHTML =
        `<span class="message-title">Something needs your attention</span>${escapeHtml(text)}`;

      message.className =
        "message error";

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }



    // =====================================================
    // CLEAR MESSAGE
    // =====================================================

    function clearMessage() {

      message.innerHTML = "";

      message.className =
        "message";

    }



    // =====================================================
    // RESET SIGNUP BUTTON
    // =====================================================

    function resetSignupButton() {

      signupButton.disabled = false;

      signupButton.textContent =
        "Create Account";

    }



    // =====================================================
    // RESET LOGIN BUTTON
    // =====================================================

    function resetLoginButton() {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }



    // =====================================================
    // FIREBASE ERROR MESSAGES
    // =====================================================

    function firebaseErrorMessage(error) {

      console.error(
        "Firebase error code:",
        error?.code
      );

      console.error(
        "Firebase error message:",
        error?.message
      );

      console.error(
        "Full Firebase error:",
        error
      );


      switch (
        error?.code
      ) {


        case "auth/email-already-in-use":

          return "An account already exists for this email. Please use Login.";


        case "auth/weak-password":

          return "Your password is too weak. Please use at least 6 characters.";


        case "auth/invalid-email":

          return "Please enter a valid email address.";


        case "auth/invalid-credential":

          return "The email or password is incorrect.";


        case "auth/user-not-found":

          return "No account was found with this email.";


        case "auth/wrong-password":

          return "The password is incorrect.";


        case "auth/too-many-requests":

          return "Too many attempts were made. Please wait a little and try again.";


        case "auth/network-request-failed":

          return "Network error. Please check your internet connection and try again.";


        case "permission-denied":

          return "Firebase denied access to the client enrollment. Please check your Firestore security rules.";


        case "failed-precondition":

          return "Firebase could not complete this request. Please check your Firestore configuration.";


        case "unavailable":

          return "Firebase is temporarily unavailable. Please try again in a moment.";


        default:

          return (
            error?.message ||
            "Something went wrong. Please try again."
          );

      }

    }



    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


  </script>


</body>

</html>
