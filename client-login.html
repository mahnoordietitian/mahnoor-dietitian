<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Client Login | Mahnoor Dietitian</title>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: #FBF8F3;

      font-family: Arial, sans-serif;

      color: #2D2D2D;

    }


    .box {

      width: 100%;

      max-width: 450px;

      padding: 36px;

      background: #ffffff;

      border-radius: 18px;

      border: 1px solid #eee;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.07);

    }


    .brand {

      text-align: center;

      color: #6E4A7E;

      font-size: 26px;

      font-weight: 600;

      margin-bottom: 8px;

    }


    h1 {

      text-align: center;

      font-size: 27px;

      margin: 20px 0 10px;

      color: #2D2D2D;

    }


    .subtitle {

      text-align: center;

      color: #777;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 28px;

    }


    .field {

      margin-bottom: 18px;

    }


    label {

      display: block;

      font-size: 14px;

      font-weight: 600;

      margin-bottom: 8px;

      color: #2D2D2D;

    }


    input {

      width: 100%;

      height: 48px;

      padding: 0 14px;

      border: 1px solid #d9d9d9;

      border-radius: 9px;

      background: #ffffff;

      color: #2D2D2D;

      font-size: 15px;

    }


    input:focus {

      outline: none;

      border-color: #6E4A7E;

      box-shadow:
        0 0 0 3px
        rgba(110, 74, 126, 0.10);

    }


    button {

      width: 100%;

      min-height: 48px;

      padding: 13px 16px;

      margin-top: 4px;

      border: none;

      border-radius: 9px;

      background: #6E4A7E;

      color: #ffffff;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

    }


    button:hover {

      opacity: 0.92;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .switch {

      text-align: center;

      margin-top: 22px;

      font-size: 14px;

      color: #777;

      line-height: 1.6;

    }


    .switch a {

      color: #6E4A7E;

      cursor: pointer;

      font-weight: 600;

      text-decoration: none;

    }


    .switch a:hover {

      text-decoration: underline;

    }


    .message {

      width: 100%;

      margin-top: 20px;

      padding: 15px 16px;

      border-radius: 10px;

      display: none;

      font-size: 14px;

      line-height: 1.6;

      word-break: break-word;

    }


    .message.success {

      display: block;

      background: #edf7ef;

      color: #286b35;

      border: 1px solid #cce8d1;

    }


    .message.error {

      display: block;

      background: #fff0f0;

      color: #9b2c2c;

      border: 1px solid #f0caca;

    }


    .message-title {

      font-weight: 700;

      display: block;

      margin-bottom: 4px;

    }


    .hidden {

      display: none !important;

    }


    @media (max-width: 500px) {

      .box {

        padding: 28px 22px;

      }


      .brand {

        font-size: 24px;

      }


      h1 {

        font-size: 24px;

      }

    }

  </style>

</head>

<body>

  <div class="box">

```

  </div>

  <!-- =========================================
       FIREBASE
  ========================================== -->

  <script type="module">


    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      updateDoc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

      authDomain:
        "mahnoor-dietitian.firebaseapp.com",

      projectId:
        "mahnoor-dietitian",

      storageBucket:
        "mahnoor-dietitian.firebasestorage.app",

      messagingSenderId:
        "900688855173",

      appId:
        "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    // =========================================
    // ELEMENTS
    // =========================================

    const loginSection =
      document.getElementById(
        "loginSection"
      );


    const signupSection =
      document.getElementById(
        "signupSection"
      );


    const message =
      document.getElementById(
        "message"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const signupButton =
      document.getElementById(
        "signupButton"
      );


    // =========================================
    // SHOW SIGNUP
    // =========================================

    document
      .getElementById("showSignup")
      .addEventListener(
        "click",
        () => {

          loginSection
            .classList
            .add("hidden");

          signupSection
            .classList
            .remove("hidden");

          clearMessage();

        }
      );


    // =========================================
    // SHOW LOGIN
    // =========================================

    document
      .getElementById("showLogin")
      .addEventListener(
        "click",
        () => {

          signupSection
            .classList
            .add("hidden");

          loginSection
            .classList
            .remove("hidden");

          clearMessage();

        }
      );


    // =========================================
    // FIND CLIENT BY EMAIL
    //
    // IMPORTANT:
    //
    // Your Firestore client documents have
    // random IDs, for example:
    //
    // clients/CWamcFfkAh6zN6mSGI2e
    //
    // Therefore we search by:
    //
    // email == client's email
    // =========================================

    async function findClientByEmail(email) {


      const clientsRef =
        collection(
          db,
          "clients"
        );


      const clientQuery =
        query(
          clientsRef,
          where(
            "email",
            "==",
            email
          )
        );


      const snapshot =
        await getDocs(
          clientQuery
        );


      if (
        snapshot.empty
      ) {

        return null;

      }


      const clientDoc =
        snapshot.docs[0];


      return {

        id:
          clientDoc.id,

        ref:
          clientDoc.ref,

        data:
          clientDoc.data()

      };

    }


    // =========================================
    // SIGNUP
    // =========================================

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async event => {


          event.preventDefault();


          clearMessage();


          signupButton.disabled =
            true;


          signupButton.textContent =
            "Checking enrollment...";


          const email =
            document
              .getElementById(
                "signupEmail"
              )
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById(
                "signupPassword"
              )
              .value;


          const confirmPassword =
            document
              .getElementById(
                "confirmPassword"
              )
              .value;


          // =====================================
          // PASSWORD CHECK
          // =====================================

          if (
            password !==
            confirmPassword
          ) {

            showError(
              "Passwords do not match. Please enter the same password in both fields."
            );


            resetSignup();


            return;

          }


          try {


            // =====================================
            // FIND ADMIN-CREATED ENROLLMENT
            // =====================================

            const client =
              await findClientByEmail(
                email
              );


            if (!client) {

              showError(
                "We couldn't find an enrollment for this email. Please use the same email address that was registered by Mahnoor Dietitian."
              );


              resetSignup();


              return;

            }


            const clientData =
              client.data;


            // =====================================
            // CHECK EXISTING UID
            // =====================================

            if (
              clientData.uid
            ) {

              showError(
                "This enrollment is already connected to an account. Please use Login instead."
              );


              resetSignup();


              return;

            }


            signupButton.textContent =
              "Creating account...";


            // =====================================
            // CREATE AUTH ACCOUNT
            // =====================================

            const credential =
              await createUserWithEmailAndPassword(
                auth,
                email,
                password
              );


            const user =
              credential.user;


            // =====================================
            // CONNECT UID TO REAL CLIENT DOCUMENT
            // =====================================

            await updateDoc(

              client.ref,

              {

                uid:
                  user.uid

              }

            );


            // =====================================
            // NO EMAIL VERIFICATION
            //
            // Nothing is sent to the email.
            // =====================================

            showSuccess(
              "Your account has been created successfully. You can now log in."
            );


            document
              .getElementById(
                "signupForm"
              )
              .reset();


            // Sign out so the client can
            // explicitly log in.

            await signOut(auth);


            // Return to login after short delay.

            setTimeout(
              () => {

                signupSection
                  .classList
                  .add("hidden");

                loginSection
                  .classList
                  .remove("hidden");

              },
              1200
            );


          } catch (error) {


            console.error(
              "Signup error:",
              error
            );


            showError(
              firebaseErrorMessage(
                error
              )
            );

          }


          resetSignup();

        }
      );


    // =========================================
    // LOGIN
    // =========================================

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async event => {


          event.preventDefault();


          clearMessage();


          loginButton.disabled =
            true;


          loginButton.textContent =
            "Logging in...";


          const email =
            document
              .getElementById(
                "loginEmail"
              )
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById(
                "loginPassword"
              )
              .value;


          try {


            // =====================================
            // FIREBASE AUTH LOGIN
            // =====================================

            const credential =
              await signInWithEmailAndPassword(
                auth,
                email,
                password
              );


            const user =
              credential.user;


            // =====================================
            // NO EMAIL VERIFICATION CHECK
            //
            // The user can continue immediately.
            // =====================================


            // =====================================
            // FIND CLIENT
            // =====================================

            const client =
              await findClientByEmail(
                email
              );


            if (!client) {


              showError(
                "Your account exists, but no client enrollment was found for this email. Please contact Mahnoor Dietitian."
              );


              await signOut(auth);


              resetLogin();


              return;

            }


            // =====================================
            // CHECK UID
            // =====================================

            if (
              client.data.uid !==
              user.uid
            ) {


              showError(
                "This account is not connected to your client enrollment. Please contact Mahnoor Dietitian."
              );


              await signOut(auth);


              resetLogin();


              return;

            }


            // =====================================
            // SUCCESS
            // =====================================

            showSuccess(
              "Login successful. Opening your dashboard..."
            );


            setTimeout(
              () => {

                window.location.href =
                  "client-dashboard.html";

              },
              800
            );


          } catch (error) {


            console.error(
              "Login error:",
              error
            );


            showError(
              firebaseErrorMessage(
                error
              )
            );


            resetLogin();

          }

        }
      );


    // =========================================
    // RESET LOGIN
    // =========================================

    function resetLogin() {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }


    // =========================================
    // RESET SIGNUP
    // =========================================

    function resetSignup() {

      signupButton.disabled =
        false;

      signupButton.textContent =
        "Create Account";

    }


    // =========================================
    // SUCCESS MESSAGE
    // =========================================

    function showSuccess(text) {

      message.innerHTML =
        `<span class="message-title">✓ Success</span>${escapeHtml(text)}`;

      message.className =
        "message success";

    }


    // =========================================
    // ERROR MESSAGE
    // =========================================

    function showError(text) {

      message.innerHTML =
        `<span class="message-title">Something needs your attention</span>${escapeHtml(text)}`;

      message.className =
        "message error";

    }


    // =========================================
    // CLEAR MESSAGE
    // =========================================

    function clearMessage() {

      message.innerHTML =
        "";

      message.className =
        "message";

    }


    // =========================================
    // FIREBASE ERROR HANDLER
    // =========================================

    function firebaseErrorMessage(error) {


      if (!error) {

        return "Something went wrong. Please try again.";

      }


      switch (error.code) {


        case "auth/email-already-in-use":

          return "An account already exists for this email. Please use Login instead.";


        case "auth/weak-password":

          return "Your password is too weak. Please use at least 6 characters.";


        case "auth/invalid-email":

          return "Please enter a valid email address.";


        case "auth/invalid-credential":

          return "The email or password is incorrect.";


        case "auth/user-not-found":

          return "No account was found with this email.";


        case "auth/wrong-password":

          return "The password is incorrect.";


        case "auth/too-many-requests":

          return "Too many attempts were made. Please wait a little and try again.";


        case "auth/network-request-failed":

          return "Network error. Please check your internet connection and try again.";


        case "permission-denied":

          return "Firebase denied access. Please make sure the latest Firestore rules have been published.";


        default:


          if (
            error.message &&
            error.message.includes(
              "Missing or insufficient permissions"
            )
          ) {

            return "Firebase denied access. Please make sure the latest Firestore rules have been published.";

          }


          return error.message ||
            "Something went wrong. Please try again.";

      }

    }


    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
