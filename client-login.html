<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Client Login | Mahnoor Dietitian</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: #FBF8F3;

      font-family: Arial, sans-serif;

      color: #2D2D2D;
    }

    .box {
      width: 100%;
      max-width: 450px;

      padding: 36px;

      background: #ffffff;

      border-radius: 18px;

      border: 1px solid #eee;

        0 12px 35px rgba(0, 0, 0, 0.07);
    }

    .brand {
      text-align: center;

      color: #6E4A7E;

      font-size: 26px;

    h1 {

    .subtitle {
      text-align: center;

      color: #777;

      margin-bottom: 28px;

    .field {
      margin-bottom: 18px;

    label {
      display: block;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      height: 48px;

      padding: 0 14px;

      border: 1px solid #d9d9d9;

      border-radius: 9px;

      background: #ffffff;

      color: #2D2D2D;

      font-size: 15px;
    }

    input:focus {
      outline: none;

      border-color: #6E4A7E;

      box-shadow:
        0 0 0 3px rgba(110, 74, 126, 0.10);
    }

    button {
      width: 100%;

      min-height: 48px;

      padding: 13px 16px;

      margin-top: 4px;

      border: none;

      border-radius: 9px;

      background: #6E4A7E;

      color: #ffffff;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    .switch {
      text-align: center;

      margin-top: 22px;

    }

    .switch a {
      color: #6E4A7E;

      text-decoration: underline;

    /* ==============================

    .message {
      width: 100%;

      margin-top: 20px;

      padding: 15px 16px;

    .message-title {
      display: block;

    @media (max-width: 500px) {

      .box {
        padding: 28px 22px;

  </style>

</head>


<body>

  <div class="box">

    <!-- BRAND -->

    <div class="brand">
      Mahnoor Dietitian
    </div>


    <!-- ==============================
         LOGIN
         ============================== -->

    <div id="loginSection">

      <h1>
        Client Login
      </h1>

      <div class="subtitle">
        Sign in to access your personal
        nutrition coaching dashboard.
      </div>


      <form id="loginForm">

        <div class="field">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <div class="switch">

        Don't have an account?

        <a id="showSignup">
          Create account
        </a>

      </div>

    </div>


    <!-- ==============================
         SIGNUP
         ============================== -->

    <div
      id="signupSection"
      class="hidden"
    >

      <h1>
        Create Your Account
      </h1>

      <div class="subtitle">
        Use the same email address
        that you provided to Mahnoor Dietitian.
      </div>


      <form id="signupForm">

        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          id="signupButton"
        >
          Create Account
        </button>

      </form>


      <div class="switch">

        Already have an account?

        <a id="showLogin">
          Login
        </a>

      </div>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
      role="alert"
    ></div>

  </div>


  <!-- ==============================
       FIREBASE
       ============================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      updateDoc,
      doc
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* ==============================
       FIREBASE CONFIG
       ============================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

      authDomain:
        "mahnoor-dietitian.firebaseapp.com",

      projectId:
        "mahnoor-dietitian",

      storageBucket:
        "mahnoor-dietitian.firebasestorage.app",

      messagingSenderId:
        "900688855173",

      appId:
        "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* ==============================
       ELEMENTS
       ============================== */

    const loginSection =
      document.getElementById("loginSection");

    const signupSection =
      document.getElementById("signupSection");

    const message =
      document.getElementById("message");

    const signupButton =
      document.getElementById("signupButton");

    const loginButton =
      document.getElementById("loginButton");


    /* ==============================
       SHOW SIGNUP
       ============================== */

    document
      .getElementById("showSignup")
      .addEventListener("click", () => {

        loginSection.classList.add("hidden");

        signupSection.classList.remove("hidden");

        clearMessage();

      });


    /* ==============================
       SHOW LOGIN
       ============================== */

    document
      .getElementById("showLogin")
      .addEventListener("click", () => {

        signupSection.classList.add("hidden");

        loginSection.classList.remove("hidden");

        clearMessage();

      });


    /* ==============================
       SIGNUP
       ============================== */

    document
      .getElementById("signupForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        clearMessage();

        signupButton.disabled = true;

        signupButton.textContent =
          "Creating Account...";


        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById("signupPassword")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /* PASSWORD CHECK */

        if (password !== confirmPassword) {

          showError(
            "Passwords do not match. Please enter the same password in both fields."
          );

          resetSignupButton();

          return;

        }


        try {

          /* ==============================
             FIND CLIENT
             ============================== */

          const clientQuery = query(

            collection(db, "clients"),

            where("email", "==", email)

          );


          const clientSnapshot =
            await getDocs(clientQuery);


          if (clientSnapshot.empty) {

            showError(
              "We couldn't find an enrollment for this email. Please make sure you are using the exact email address registered by Mahnoor Dietitian."
            );

            resetSignupButton();

            return;

          }


          const existingClient =
            clientSnapshot.docs[0];


          const existingData =
            existingClient.data();


          /* ==============================
             CHECK UID
             ============================== */

          if (existingData.uid) {

            showError(
              "An account is already connected to this enrollment. Please use the Login option."
            );

            resetSignupButton();

            return;

          }


          /* ==============================
             CREATE AUTH ACCOUNT
             ============================== */

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /* ==============================
             EMAIL VERIFICATION
             ============================== */

          await sendEmailVerification(user);


          showSuccess(
            "Your account has been created. Please check your email and click the verification link. After verifying your email, return here and log in."
          );


          document
            .getElementById("signupForm")
            .reset();


        }

        catch (error) {

          console.error(
            "SIGNUP ERROR:",
            error
          );


          showError(
            firebaseErrorMessage(error)
          );

        }


        resetSignupButton();

      });


    /* ==============================
       LOGIN
       ============================== */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        clearMessage();

        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById("loginPassword")
            .value;


        try {

          /* ==============================
             FIREBASE LOGIN
             ============================== */

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          await user.reload();


          /* ==============================
             VERIFY EMAIL
             ============================== */

          if (!user.emailVerified) {

            showError(
              "Your email is not verified yet. Please check your inbox and click the verification link before logging in."
            );

            loginButton.disabled = false;

            loginButton.textContent =
              "Login";

            return;

          }


          /* ==============================
             FIND CLIENT
             ============================== */

          const clientQuery = query(

            collection(db, "clients"),

            where("email", "==", email)

          );


          const snapshot =
            await getDocs(clientQuery);


          if (snapshot.empty) {

            showError(
              "Your account exists, but we could not find your enrollment. Please contact Mahnoor Dietitian."
            );

            loginButton.disabled = false;

            loginButton.textContent =
              "Login";

            return;

          }


          const clientDoc =
            snapshot.docs[0];


          const clientData =
            clientDoc.data();


          /* ==============================
             CONNECT UID
             ============================== */

          if (!clientData.uid) {

            await updateDoc(

              doc(
                db,
                "clients",
                clientDoc.id
              ),

              {
                uid: user.uid
              }

            );

          }

          else if (
            clientData.uid !== user.uid
          ) {

            showError(
              "This enrollment is already connected to another account."
            );

            loginButton.disabled = false;

            loginButton.textContent =
              "Login";

            return;

          }


          /* ==============================
             SUCCESS
             ============================== */

          showSuccess(
            "Login successful. Opening your dashboard..."
          );


          setTimeout(() => {

            window.location.href =
              "client-dashboard.html";

          }, 1200);


        }

        catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          showError(
            firebaseErrorMessage(error)
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      });


    /* ==============================
       SUCCESS MESSAGE
       ============================== */

    function showSuccess(text) {

      const safeText =
        text ||
        "Your request was completed successfully.";

      message.innerHTML =
        `
        <span class="message-title">
          ✓ Success
        </span>
        <div>${safeText}</div>
        `;

      message.className =
        "message success";

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }


    /* ==============================
       ERROR MESSAGE
       ============================== */

    function showError(text) {

      const safeText =
        text ||
        "Something went wrong. Please try again.";

      message.innerHTML =
        `
        <span class="message-title">
          Something needs your attention
        </span>
        <div>${safeText}</div>
        `;

      message.className =
        "message error";

      message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }


    /* ==============================
       CLEAR MESSAGE
       ============================== */

    function clearMessage() {

      message.innerHTML = "";

      message.className =
        "message";

    }


    /* ==============================
       RESET SIGNUP BUTTON
       ============================== */

    function resetSignupButton() {

      signupButton.disabled = false;

      signupButton.textContent =
        "Create Account";

    }


    /* ==============================
       FIREBASE ERROR HANDLER
       ============================== */

    function firebaseErrorMessage(error) {

      console.error(
        "Firebase error:",
        error
      );


      if (!error) {

        return "Something went wrong. Please try again.";

      }


      const code =
        error.code || "";


      switch (code) {

        case "auth/email-already-in-use":

          return "An account already exists for this email. Please use Login.";

        case "auth/weak-password":

          return "Your password is too weak. Please use at least 6 characters.";

        case "auth/invalid-email":

          return "Please enter a valid email address.";

        case "auth/invalid-credential":

          return "The email or password is incorrect.";

        case "auth/user-not-found":

          return "No Firebase account was found with this email.";

        case "auth/wrong-password":

          return "The password is incorrect.";

        case "auth/too-many-requests":

          return "Too many attempts were made. Please wait a little and try again.";

        case "auth/network-request-failed":

          return "Network error. Please check your internet connection and try again.";

        case "auth/operation-not-allowed":

          return "Email/password login is not enabled in Firebase Authentication.";

        case "permission-denied":

          return "Firebase denied access to the client enrollment. Please check your Firestore security rules.";

        case "failed-precondition":

          return "Firebase needs an additional configuration before this request can continue.";

        default:

          if (error.message) {

            return error.message;

          }

          return "Something went wrong. Please try again.";

      }

    }

  </script>

</body>

</html>
