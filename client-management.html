<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

  authDomain:
    "mahnoor-dietitian.firebaseapp.com",

  projectId:
    "mahnoor-dietitian",

  storageBucket:
    "mahnoor-dietitian.firebasestorage.app",

  messagingSenderId:
    "900688855173",

  appId:
    "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const ADMIN_EMAIL =
  "mahnoordietitian3@gmail.com";


/* =========================
   ELEMENTS
========================= */

const clientList =
  document.getElementById("clientList");

const searchInput =
  document.getElementById("searchInput");

const statusFilter =
  document.getElementById("statusFilter");

const clientModal =
  document.getElementById("clientModal");

const detailModal =
  document.getElementById("detailModal");

const clientForm =
  document.getElementById("clientForm");

const formMessage =
  document.getElementById("formMessage");

let clients = [];

let editingId = null;


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.href =
        "login.html";

      return;

    }


    if(
      user.email?.toLowerCase()
      !== ADMIN_EMAIL.toLowerCase()
    ){

      alert(
        "You do not have permission to access the Admin Panel."
      );

      await signOut(auth);

      window.location.href =
        "login.html";

      return;

    }


    await loadClients();

  }
);


/* =========================
   LOAD CLIENTS
========================= */

async function loadClients(){

  clientList.innerHTML =
    `<div class="empty">Loading clients...</div>`;

  try{

    const snapshot =
      await getDocs(
        collection(db,"clients")
      );

    clients =
      snapshot.docs.map(item => ({

        id:item.id,

        ...item.data()

      }));


    updateSummary();

    renderClients();

  }
  catch(error){

    console.error(error);

    clientList.innerHTML =
      `<div class="empty">
        Unable to load clients.<br><br>
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

  document.getElementById(
    "totalClients"
  ).textContent =
    clients.length;


  const today =
    getToday();


  const active =
    clients.filter(client =>

      client.startDate &&
      client.endDate &&
      client.startDate <= today &&
      client.endDate >= today

    );


  document.getElementById(
    "activeClients"
  ).textContent =
    active.length;


  const connected =
    clients.filter(client =>
      Boolean(client.uid)
    );


  document.getElementById(
    "connectedClients"
  ).textContent =
    connected.length;


  const payments =
    clients.reduce(
      (sum,client) =>
        sum +
        Number(client.amountPaid || 0),
      0
    );


  document.getElementById(
    "totalPayments"
  ).textContent =
    "Rs. " +
    payments.toLocaleString();

}


/* =========================
   RENDER
========================= */

function renderClients(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const filter =
    statusFilter.value;

  let filtered =
    clients.filter(client => {

      const name =
        String(client.name || "")
          .toLowerCase();

      const email =
        String(client.email || "")
          .toLowerCase();

      const matchesSearch =
        !search ||
        name.includes(search) ||
        email.includes(search);


      if(!matchesSearch)
        return false;


      const active =
        isActive(client);

      const connected =
        Boolean(client.uid);


      if(
        filter === "active" &&
        !active
      )
        return false;


      if(
        filter === "expired" &&
        active
      )
        return false;


      if(
        filter === "connected" &&
        !connected
      )
        return false;


      if(
        filter === "not-connected" &&
        connected
      )
        return false;


      return true;

    });


  if(filtered.length === 0){

    clientList.innerHTML =
      `<div class="empty">
        No clients found.
      </div>`;

    return;

  }


  clientList.innerHTML =
    filtered
      .map(client => clientHTML(client))
      .join("");


  document
    .querySelectorAll("[data-view]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          showDetails(
            button.dataset.view
          );

        }
      );

    });


  document
    .querySelectorAll("[data-edit]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openEdit(
            button.dataset.edit
          );

        }
      );

    });


  document
    .querySelectorAll("[data-delete]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteClient(
            button.dataset.delete
          );

        }
      );

    });

}


/* =========================
   CLIENT HTML
========================= */

function clientHTML(client){

  const active =
    isActive(client);

  const connected =
    Boolean(client.uid);


  const statusClass =
    active
      ? "active"
      : "expired";


  const statusText =
    active
      ? "Active"
      : "Expired";


  return `

    <div class="client-card">

      <div>

        <div class="client-name">
          ${escapeHtml(client.name || "Unnamed Client")}
        </div>

        <div class="client-email">
          ${escapeHtml(client.email || "")}
        </div>

        <div class="client-program">
          ${escapeHtml(client.programName || "No program")}
          ${client.duration
            ? ` • ${escapeHtml(String(client.duration))} days`
            : ""}
        </div>

        <div class="client-payment">
          Start:
          ${escapeHtml(client.startDate || "-")}
          &nbsp;|&nbsp;
          End:
          ${escapeHtml(client.endDate || "-")}
          <br>
          Paid:
          Rs. ${Number(client.amountPaid || 0).toLocaleString()}
          &nbsp;|&nbsp;
          Remaining:
          Rs. ${Number(client.remainingAmount || 0).toLocaleString()}
        </div>

        <span class="status ${statusClass}">
          ${statusText}
        </span>

        <span class="status ${
          connected
            ? "connected"
            : "not-connected"
        }">
          ${
            connected

/* =========================
   SAVE
========================= */

clientForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      value("email")
        .trim()
        .toLowerCase();


    const price =
      Number(value("programPrice"))
      || 0;


    const paid =
      Number(value("amountPaid"))
      || 0;


    const remaining =
      Math.max(
        price - paid,
        0
      );


    const data = {

      name:
        value("name").trim(),

      email,

      phone:
        value("phone").trim(),

      dob:
        value("dob"),

      city:
        value("city").trim(),

      programType:
        value("programType"),

      programName:
        value("programName").trim(),

      duration:
        Number(value("duration")),

      startDate:
        value("startDate"),

      endDate:
        value("endDate"),

      programPrice:
        price,

      amountPaid:
        paid,

      remainingAmount:
        remaining,

      paymentStatus:
        value("paymentStatus"),

      paymentMethod:
        value("paymentMethod"),

      notes:
        value("notes").trim(),

      updatedAt:
        serverTimestamp()

    };


    const saveButton =
      document.getElementById(
        "saveBtn"
      );


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    try{

      if(editingId){

        /*
          IMPORTANT:
          We update the existing Firestore
          document using its REAL document ID.

          We do NOT change the document ID.
          This prevents the client UID/enrollment
          connection from breaking.
        */

        await updateDoc(

          doc(
            db,
            "clients",
            editingId
          ),

          data

        );


        showFormMessage(
          "Client updated successfully.",
          "success"
        );

      }
      else{

        data.createdAt =
          serverTimestamp();


        /*
          Firestore automatically creates
          the document ID.
        */

        const newClient =
          await addDoc(

            collection(
              db,
              "clients"
            ),

            data

          );


        console.log(
          "New client document ID:",
          newClient.id
        );


        showFormMessage(
          "Client added successfully.",
          "success"
        );

      }


      await loadClients();


      setTimeout(
        closeClientModal,
        700
      );

    }
    catch(error){

      console.error(error);

      showFormMessage(
        firebaseErrorMessage(error),
        "error"
      );

    }


    saveButton.disabled =
      false;

    saveButton.textContent =
      editingId
        ? "Update Client"
        : "Save Client";

  }
);

async function deleteClient(id){

  const client =
    clients.find(
      item => item.id === id
    );

  if(!client) return;


  const confirmed =
    confirm(
      `Delete ${client.name || "this client"}?\n\nThis removes the client record from Firestore.`
    );


  if(!confirmed)
    return;


  try{

    await deleteDoc(
      doc(
        db,
        "clients",
        id
      )
    );


    await loadClients();

  }
  catch(error){

    console.error(error);

    alert(
      firebaseErrorMessage(error)
    );

  }

}

function calculateEndDate(){

  const start =
    value("startDate");

  const duration =
    Number(
      value("duration")
    );


  if(
    !start ||
    !duration
  ){

    setValue(
      "endDate",
      ""
    );

    return;

  }


  const date =
    new Date(
      start + "T00:00:00"
    );


  date.setDate(
    date.getDate() +
    duration -
    1
  );


  setValue(
    "endDate",
    formatDate(date)
  );

}

/* =========================
   HELPERS
========================= */

function value(id){

  return document
    .getElementById(id)
    .value;

}


function setValue(
  id,
  value
){

  document
    .getElementById(id)
    .value =
    value ?? "";

}


function getToday(){

  const now =
    new Date();

  return formatDate(now);

}


function isActive(client){

  const today =
    getToday();

  return Boolean(
    client.startDate &&
    client.endDate &&
    client.startDate <= today &&
    client.endDate >= today
  );

}


function formatDate(date){

  return [

    date.getFullYear(),

    String(
      date.getMonth() + 1
    ).padStart(2,"0"),

    String(
      date.getDate()
    ).padStart(2,"0")

  ].join("-");

}


function detail(
  label,
  value
){

  return `

    <div class="detail">

      <div class="detail-label">
        ${escapeHtml(label)}
      </div>

      <div class="detail-value">
        ${escapeHtml(value || "—")}
      </div>

    </div>

  `;

}


function showFormMessage(
  text,
  type
){

  formMessage.textContent =
    text;

  formMessage.className =
    "message show " +
    type;

}


function firebaseErrorMessage(
  error
){

  if(
    error?.message
      ?.includes(
        "Missing or insufficient permissions"
      )
  ){

    return(
      "Firebase denied access. Please check that your Firestore rules are published and allow the admin account to manage clients."
    );

  }


  if(
    error?.code ===
    "permission-denied"
  ){

    return(
      "You do not have permission to perform this action."
    );

  }


  return(
    error?.message ||
    "Something went wrong. Please try again."
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
