<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My 1:1 Coaching | Mahnoor Dietitian</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#FBF8F3;
  color:#2D2D2D;
}

/* =====================================================
   HEADER
===================================================== */

header{
  height:72px;
  background:#ffffff;
  border-bottom:1px solid #eadfe9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  color:#6E4A7E;
  font-size:22px;
  font-weight:700;
}

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.welcome{
  font-size:13px;
  color:#777;
}

.logout-btn{
  border:none;
  background:#6E4A7E;
  color:white;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.logout-btn:hover{
  opacity:.9;
}

/* =====================================================
   LAYOUT
===================================================== */

.layout{
  display:flex;
  min-height:calc(100vh - 72px);
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  width:250px;
  background:#ffffff;
  border-right:1px solid #eadfe9;
  padding:25px 15px;
  flex-shrink:0;
}

.sidebar-title{
  font-size:11px;
  color:#999;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:0 12px;
  margin-bottom:10px;
}

.nav-btn{
  width:100%;
  border:none;
  background:transparent;
  color:#555;
  padding:12px;
  border-radius:9px;
  text-align:left;
  cursor:pointer;
  margin-bottom:4px;
  font-size:14px;
}

.nav-btn:hover{
  background:#f5eff6;
  color:#6E4A7E;
}

.nav-btn.active{
  background:#eee5f0;
  color:#6E4A7E;
  font-weight:700;
}

/* =====================================================
   MAIN
===================================================== */

main{
  flex:1;
  min-width:0;
  padding:35px;
  max-width:1200px;
}

/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{
  margin-bottom:28px;
}

.page-header h1{
  margin:0 0 8px;
  font-size:32px;
}

.page-header p{
  margin:0;
  color:#777;
  line-height:1.6;
}

.program-badge{
  display:inline-block;
  margin-top:13px;
  background:#eee5f0;
  color:#6E4A7E;
  padding:7px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:17px;
  padding:28px;
  margin-bottom:25px;
}

.hero h2{
  margin:0 0 8px;
  color:#6E4A7E;
}

.hero p{
  color:#666;
  line-height:1.7;
  margin:0;
}

/* =====================================================
   SECTION
===================================================== */

.page-section{
  display:none;
}

.page-section.active{
  display:block;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title span{
  font-size:12px;
  color:#888;
}

/* =====================================================
   PHASE
===================================================== */

.phase-card{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:16px;
  margin-bottom:20px;
  overflow:hidden;
}

.phase-header{
  padding:20px;
  background:#faf7fb;
  border-bottom:1px solid #eee6ee;
}

.phase-number{
  color:#6E4A7E;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.phase-title{
  font-size:20px;
  font-weight:700;
  margin-top:5px;
}

.phase-description{
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin-top:6px;
}

/* =====================================================
   WEEK CARDS
===================================================== */

.week-list{
  display:flex;
  flex-direction:column;
  gap:15px;
  padding:15px;
}

.week-card{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:15px;
  overflow:hidden;
}

.week-header{
  padding:19px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.week-header:hover{
  background:#fcfafc;
}

.week-number{
  color:#6E4A7E;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:5px;
}

.week-title{
  font-size:18px;
  font-weight:700;
}

.week-description{
  color:#777;
  font-size:13px;
  margin-top:5px;
  line-height:1.5;
}

.arrow{
  color:#6E4A7E;
  font-size:20px;
}

.week-card.open .arrow{
  transform:rotate(90deg);
}

.week-days{
  display:none;
  border-top:1px solid #eee6ee;
  padding:15px;
  background:#fcfafc;
}

.week-card.open .week-days{
  display:block;
}

/* =====================================================
   DAY CARD
===================================================== */

.day-card{
  background:#ffffff;
  border:1px solid #eee6ee;
  border-radius:11px;
  padding:17px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.day-card:last-child{
  margin-bottom:0;
}

.day-card:hover{
  border-color:#cdb9d1;
}

.day-card.completed{
  border-color:#b9d8c0;
  background:#fbfefb;
}

.day-left{
  min-width:0;
}

.day-label{
  color:#6E4A7E;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:5px;
}

.day-title{
  font-weight:700;
  font-size:15px;
}

.day-description{
  color:#777;
  font-size:12px;
  margin-top:5px;
  line-height:1.5;
}

.day-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.completed-badge{
  background:#e7f3e9;
  color:#28733a;
  padding:6px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:700;
}

.day-arrow{
  color:#6E4A7E;
}

/* =====================================================
   DAY CONTENT
===================================================== */

.back-link{
  border:none;
  background:#eee5f0;
  color:#6E4A7E;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:18px;
  font-weight:600;
}

.day-content-box{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:16px;
  padding:25px;
}

.day-content-box h2{
  margin:0 0 8px;
  color:#6E4A7E;
}

.day-subtitle{
  color:#777;
  margin-bottom:20px;
  line-height:1.6;
}

/* =====================================================
   COMPLETION BOX
===================================================== */

.completion-box{
  background:#faf7fb;
  border:1px solid #eadfe9;
  border-radius:14px;
  padding:18px;
  margin-bottom:25px;
}

.completion-status{
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin-bottom:12px;
}

.complete-day-btn{
  border:none;
  background:#6E4A7E;
  color:#ffffff;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}

.complete-day-btn:hover{
  opacity:.92;
}

.complete-day-btn.completed{
  background:#28733a;
  cursor:default;
}

.complete-day-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.completion-date{
  color:#28733a;
  font-size:12px;
  margin-top:8px;
}

/* =====================================================
   LESSON
===================================================== */

.lesson{
  border-top:1px solid #eee6ee;
  padding:20px 0;
}

.lesson:first-child{
  border-top:none;
  padding-top:0;
}

.lesson h3{
  margin:0 0 9px;
}

.lesson p{
  color:#555;
  line-height:1.7;
  white-space:pre-line;
}

.video-wrapper{
  position:relative;
  width:100%;
  padding-top:56.25%;
  margin-top:15px;
  border-radius:12px;
  overflow:hidden;
  background:#f3edf4;
}

.video-wrapper iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.resource-button{
  display:inline-block;
  background:#eee5f0;
  color:#6E4A7E;
  padding:10px 14px;
  border-radius:8px;
  text-decoration:none;
  margin:6px 5px 0 0;
  font-size:12px;
  font-weight:600;
}

.lesson-image{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  margin-top:15px;
}

/* =====================================================
   CONTENT CARDS
===================================================== */

.content-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.content-card{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:14px;
  padding:20px;
}

.content-icon{
  width:42px;
  height:42px;
  border-radius:10px;
  background:#eee5f0;
  color:#6E4A7E;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin-bottom:13px;
}

.content-card h3{
  margin:0 0 7px;
  font-size:17px;
}

.content-card p{
  margin:0;
  color:#777;
  font-size:13px;
  line-height:1.6;
  white-space:pre-line;
}

.content-link{
  display:inline-block;
  margin-top:14px;
  background:#6E4A7E;
  color:#ffffff;
  text-decoration:none;
  padding:9px 13px;
  border-radius:8px;
  font-size:12px;
  font-weight:600;
}

/* =====================================================
   CHECKINS
===================================================== */

.checkin-box{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:16px;
  padding:25px;
}

.checkin-box h2{
  margin-top:0;
  color:#6E4A7E;
}

.checkin-box p{
  color:#777;
  line-height:1.6;
}

textarea{
  width:100%;
  min-height:130px;
  padding:13px;
  border:1px solid #d9d0d9;
  border-radius:9px;
  resize:vertical;
  font-family:inherit;
}

textarea:focus{
  outline:none;
  border-color:#6E4A7E;
}

.save-btn{
  margin-top:12px;
  border:none;
  background:#6E4A7E;
  color:white;
  padding:11px 17px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

/* =====================================================
   COMMUNITY
===================================================== */

.post{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:14px;
  padding:20px;
  margin-bottom:14px;
}

.post-date{
  color:#999;
  font-size:11px;
  margin-bottom:7px;
}

.post h3{
  margin:0 0 8px;
}

.post p{
  color:#555;
  line-height:1.7;
  white-space:pre-line;
}

/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading{
  padding:50px;
  text-align:center;
  color:#777;
}

.empty{
  background:#ffffff;
  border:1px solid #eadfe9;
  border-radius:14px;
  padding:40px;
  text-align:center;
  color:#777;
}

/* =====================================================
   ERROR
===================================================== */

.error-box{
  background:#fff5f5;
  border:1px solid #eccaca;
  color:#8b3333;
  padding:18px;
  border-radius:12px;
  line-height:1.6;
}

/* =====================================================
   MOBILE
===================================================== */

  header{
    padding:0 15px;
  }

  .welcome{
    display:none;
  }

  .layout{
    display:block;
  }

  .sidebar{
    width:100%;
    border-right:none;
    border-bottom:1px solid #eadfe9;
    padding:10px;
    display:flex;
    overflow-x:auto;
    gap:5px;
  }

  .sidebar-title{
    display:none;
  }

  .nav-btn{
    width:auto;
    white-space
