<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Mahnoor Dietitian</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #FBF8F3;
      color: #2D2D2D;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      margin: 20px;
      padding: 40px 30px;

      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 30px;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;

      border: 1px solid #ddd;
      border-radius: 8px;

      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #6E4A7E;
    }

    button {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #6E4A7E;
      color: white;

      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #6E4A7E;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Mahnoor Dietitian</h1>

    <div class="subtitle">
      Login to continue to your account.
    </div>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <a href="index.html" class="back">
      ← Back
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // Firebase configuration

    const firebaseConfig = {

      apiKey: "AIzaSyD2ujbndGIuDHuDz4vF2u39raGIPqqFLJs",

      authDomain:
        "mahnoor-dietitian.firebaseapp.com",

      projectId:
        "mahnoor-dietitian",

      storageBucket:
        "mahnoor-dietitian.firebasestorage.app",

      messagingSenderId:
        "900688855173",

      appId:
        "1:900688855173:web:d4f64047d5d2f80dfbe9ec"

    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Login

    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.textContent = "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.textContent =
          "Login successful ✓";

      } catch (error) {

        console.error(error);

        message.textContent =
          "Incorrect email or password.";

      }

    });

  </script>

</body>
</html>
